<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VidFlow</title>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#0f0f0f;
  color:white;
}

body.light{
  background:white;
  color:#111;
}

/* =========================
   HEADER
========================= */

header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:64px;
  background:#0f0f0f;
  border-bottom:1px solid #272727;
  display:flex;
  align-items:center;
  padding:0 18px;
  z-index:1000;
}

body.light header{
  background:white;
  border-bottom:1px solid #ddd;
}

.logo{
  width:180px;
  font-size:25px;
  font-weight:800;
  color:#ff0033;
  cursor:pointer;
}

.search-box{
  flex:1;
  max-width:650px;
  margin:auto;
  display:flex;
}

.search-box input{
  width:100%;
  height:40px;
  background:#121212;
  color:white;
  border:1px solid #303030;
  border-radius:22px 0 0 22px;
  padding:0 18px;
  font-size:15px;
  outline:none;
}

body.light .search-box input{
  background:#f2f2f2;
  color:#111;
  border-color:#ccc;
}

.search-box button{
  width:55px;
  border:1px solid #303030;
  border-left:0;
  background:#222;
  color:white;
  border-radius:0 22px 22px 0;
  cursor:pointer;
}

.top-settings{
  width:45px;
  height:45px;
  margin-left:auto;
  border:0;
  background:transparent;
  color:white;
  font-size:23px;
  cursor:pointer;
}

body.light .top-settings{
  color:#111;
}


/* =========================
   HOME
========================= */

#homePage{
  width:100%;
  min-height:100vh;
  padding:84px 22px 30px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:22px;
}

.category{
  border:0;
  background:#272727;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.category.active{
  background:#ff0033;
}

body.light .category{
  background:#eeeeee;
  color:#111;
}

body.light .category.active{
  background:#ff0033;
  color:white;
}


/* =========================
   VIDEO GRID
========================= */

.video-grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px 18px;
}

.video-card{
  cursor:pointer;
}

.thumbnail{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  border-radius:10px;
  display:block;
  background:#222;
  transition:.2s;
}

.video-card:hover .thumbnail{
  transform:scale(1.015);
}

.video-info{
  display:flex;
  gap:10px;
  padding-top:10px;
}

.channel-icon{
  width:36px;
  height:36px;
  border-radius:50%;
  background:#ff0033;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  flex-shrink:0;
}

.video-title{
  font-size:16px;
  font-weight:600;
  line-height:1.35;
}

.channel-name{
  color:#aaa;
  font-size:13px;
  margin-top:7px;
}

.verified{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:16px;
  height:16px;
  margin-left:4px;
  border-radius:50%;
  background:#3ea6ff;
  color:white;
  font-size:10px;
  font-weight:bold;
  vertical-align:middle;
}


/* =========================
   WATCH
========================= */

#watchPage{
  display:none;
  width:100%;
  min-height:100vh;
  padding:84px 22px 40px;
}

.watch-container{
  width:100%;
  max-width:1200px;
  margin:auto;
}

.back-button{
  border:0;
  background:#272727;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:18px;
}

body.light .back-button{
  background:#eeeeee;
  color:#111;
}

.video-player{
  width:100%;
  aspect-ratio:16/9;
  min-height:300px;
  border:0;
  border-radius:12px;
  background:#000;
  display:block;
}

.watch-title{
  font-size:25px;
  line-height:1.3;
  margin:18px 0 8px;
}

.watch-channel{
  font-size:16px;
  color:#aaa;
  margin-bottom:18px;
}

.subscribe{
  border:0;
  background:#ff0033;
  color:white;
  padding:12px 20px;
  border-radius:22px;
  font-weight:bold;
  cursor:pointer;
}


/* =========================
   SETTINGS
========================= */

.settings-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:2000;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.settings-box{
  width:100%;
  max-width:500px;
  background:#181818;
  color:white;
  border-radius:15px;
  padding:22px;
}

body.light .settings-box{
  background:white;
  color:#111;
}

.settings-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:25px;
}

.settings-header h2{
  margin:0;
}

.close-settings{
  border:0;
  background:transparent;
  color:inherit;
  font-size:30px;
  cursor:pointer;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:18px 0;
  border-top:1px solid #333;
}

body.light .setting-row{
  border-color:#ddd;
}

.setting-name{
  font-weight:bold;
  font-size:16px;
}

.setting-description{
  color:#999;
  font-size:13px;
  margin-top:5px;
}


/* =========================
   SWITCH
========================= */

.switch{
  position:relative;
  width:50px;
  height:28px;
  flex-shrink:0;
}

.switch input{
  display:none;
}

.slider{
  position:absolute;
  inset:0;
  background:#555;
  border-radius:20px;
  cursor:pointer;
}

.slider:before{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  left:3px;
  top:3px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.switch input:checked + .slider{
  background:#ff0033;
}

.switch input:checked + .slider:before{
  transform:translateX(22px);
}


/* =========================
   LANGUAGE
========================= */

.language-buttons{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.language-button{
  border:1px solid #444;
  background:#252525;
  color:white;
  padding:9px 14px;
  border-radius:8px;
  cursor:pointer;
}

.language-button.active{
  border-color:#ff0033;
  background:#ff0033;
}

body.light .language-button{
  background:#eee;
  color:#111;
  border-color:#ccc;
}

body.light .language-button.active{
  background:#ff0033;
  color:white;
  border-color:#ff0033;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:1100px){

  .video-grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:750px){

  header{
    padding:0 10px;
  }

  .logo{
    width:auto;
    margin-right:12px;
  }

  .search-box{
    max-width:none;
  }

  .video-grid{
    grid-template-columns:repeat(2,1fr);
    gap:20px 12px;
  }

  #homePage,
  #watchPage{
    padding-left:12px;
    padding-right:12px;
  }

  .video-title{
    font-size:14px;
  }

}

@media(max-width:500px){

  .logo{
    font-size:20px;
  }

  .search-box input{
    font-size:13px;
    padding:0 12px;
  }

  .search-box button{
    width:45px;
  }

  .video-grid{
    grid-template-columns:1fr;
  }

  .watch-title{
    font-size:20px;
  }

  .video-player{
    min-height:220px;
  }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <div
    class="logo"
    onclick="showHome()"
  >
    VidFlow
  </div>


  <div class="search-box">

    <input
      type="text"
      id="searchInput"
      placeholder="Search"
      onkeyup="searchVideos()"
    >

    <button onclick="searchVideos()">
      🔍
    </button>

  </div>


  <button
    class="top-settings"
    onclick="openSettings()"
    aria-label="Settings"
  >
    ⚙️
  </button>

</header>



<!-- =========================
     HOME
========================= -->

<main id="homePage">


  <!-- CHANNEL BUTTONS -->

  <div class="categories">

    <button
      class="category active"
      id="mrbeastButton"
      onclick="showChannel('mrbeast')"
    >
      MrBeast
    </button>


    <button
      class="category"
      id="gamingButton"
      onclick="showChannel('gaming')"
    >
      MrBeast Gaming
    </button>

  </div>


  <!-- VIDEO GRID -->

  <div
    class="video-grid"
    id="videoGrid"
  ></div>


</main>



<!-- =========================
     WATCH PAGE
========================= -->

<main id="watchPage">

  <div class="watch-container">


    <button
      class="back-button"
      onclick="showHome()"
      data-i18n="back"
    >
      ← Back
    </button>


    <iframe
      id="videoPlayer"
      class="video-player"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
    ></iframe>


    <h1
      id="watchTitle"
      class="watch-title"
    ></h1>


    <div class="watch-channel">

      <span id="watchChannelName">
        MrBeast
      </span>

      <span class="verified">
        ✓
      </span>

    </div>


    <button
      class="subscribe"
      id="subscribeButton"
      onclick="openChannel()"
      data-i18n="subscribe"
    >
      Subscribe on YouTube
    </button>


  </div>

</main>



<!-- =========================
     SETTINGS
========================= -->

<div
  class="settings-overlay"
  id="settingsOverlay"
>

  <div class="settings-box">


    <div class="settings-header">

      <h2 data-i18n="settings">
        Settings
      </h2>

      <button
        class="close-settings"
        onclick="closeSettings()"
      >
        ×
      </button>

    </div>


    <!-- DARK MODE -->

    <div class="setting-row">

      <div>

        <div
          class="setting-name"
          data-i18n="darkTheme"
        >
          Dark Black Theme
        </div>

        <div
          class="setting-description"
          data-i18n="darkThemeDescription"
        >
          Use the dark VidFlow interface
        </div>

      </div>


      <label class="switch">

        <input
          type="checkbox"
          id="themeToggle"
          checked
          onchange="toggleTheme()"
        >

        <span class="slider"></span>

      </label>

    </div>


    <!-- LANGUAGE -->

    <div class="setting-row">

      <div style="width:100%;">

        <div
          class="setting-name"
          data-i18n="language"
        >
          Language
        </div>

        <div class="setting-description">

          <span id="currentLanguage">
            English
          </span>

        </div>


        <div class="language-buttons">

          <button
            class="language-button"
            id="thaiButton"
            onclick="setLanguage('th')"
          >
            🇹🇭 ไทย
          </button>


          <button
            class="language-button"
            id="englishButton"
            onclick="setLanguage('en')"
          >
            🇺🇸 English
          </button>

        </div>

      </div>

    </div>


  </div>

</div>



<script>


/* ==================================================
   VIDEO DATA
================================================== */


const mrbeastVideos = [

  {
    id:"v9QtM6qnG50",
    title:"I Built A City To Save Kids From Illegal Labor"
  },

  {
    id:"gTKS8SAwUzE",
    title:"I Survived The Most Extreme Places On Earth"
  },

  {
    id:"Qtl8lJwbd4g",
    title:"Escape 100 Cops, Win $500,000"
  },

  {
    id:"Af6i6ChAVTw",
    title:"Last To Leave Mansion, Keeps It"
  },

  {
    id:"lVylRtlPOIE",
    title:"I Granted 100 Kids Their Biggest Wish!"
  }

];


const gamingVideos = [

  {
    id:"PyLGTmWz37U",
    title:"I Found My 13 Year Old Minecraft World"
  },

  {
    id:"kJu5VMN3yow",
    title:"I Survived 100 Days on One Block"
  },

  {
    id:"Dy06SXknr_g",
    title:"World's Largest Minecraft Build!"
  },

  {
    id:"gVE2t-LRK-s",
    title:"Whatever You Hide As, You Keep!"
  },

  {
    id:"PRp5Y543LN0",
    title:"Exploring My Abandoned Minecraft Server"
  }

];


let currentChannel = "mrbeast";


/* ==================================================
   LANGUAGE
================================================== */

const translations = {

  en:{
    search:"Search",
    back:"← Back",
    subscribe:"Subscribe on YouTube",
    settings:"Settings",
    darkTheme:"Dark Black Theme",
    darkThemeDescription:"Use the dark VidFlow interface",
    language:"Language",
    english:"English",
    thai:"Thai"
  },

  th:{
    search:"ค้นหา",
    back:"← ย้อนกลับ",
    subscribe:"ติดตามบน YouTube",
    settings:"ตั้งค่า",
    darkTheme:"ธีมสีดำ",
    darkThemeDescription:"ใช้หน้าตา VidFlow แบบสีเข้ม",
    language:"ภาษา",
    english:"อังกฤษ",
    thai:"ไทย"
  }

};


/* ==================================================
   LANGUAGE FUNCTION
================================================== */

function setLanguage(lang){

  localStorage.setItem(
    "vidflow-language",
    lang
  );

  applyLanguage(lang);

}


function applyLanguage(lang){

  const t =
    translations[lang] ||
    translations.en;


  document.documentElement.lang =
    lang;


  document
    .querySelectorAll("[data-i18n]")
    .forEach(element => {

      const key =
        element.dataset.i18n;

      if(t[key]){

        element.textContent =
          t[key];

      }

    });


  document
    .getElementById("searchInput")
    .placeholder =
    t.search;


  document
    .getElementById("currentLanguage")
    .textContent =
    lang === "th"
      ? t.thai
      : t.english;


  document
    .getElementById("thaiButton")
    .classList.toggle(
      "active",
      lang === "th"
    );


  document
    .getElementById("englishButton")
    .classList.toggle(
      "active",
      lang === "en"
    );

}


/* ==================================================
   SHOW CHANNEL
================================================== */

function showChannel(channel){

  currentChannel =
    channel;


  document
    .getElementById("mrbeastButton")
    .classList.toggle(
      "active",
      channel === "mrbeast"
    );


  document
    .getElementById("gamingButton")
    .classList.toggle(
      "active",
      channel === "gaming"
    );


  const videos =
    channel === "gaming"
      ? gamingVideos
      : mrbeastVideos;


  renderVideos(videos);

}


/* ==================================================
   RENDER VIDEOS
================================================== */

function renderVideos(videos){

  const grid =
    document.getElementById(
      "videoGrid"
    );


  grid.innerHTML = "";


  videos.forEach(video => {


    const card =
      document.createElement("div");


    card.className =
      "video-card";


    card.dataset.title =
      video.title;


    card.onclick =
      function(){

        openVideo(
          video.id,
          video.title
        );

      };


    card.innerHTML = `

      <img
        class="thumbnail"
        src="https://i.ytimg.com/vi/${video.id}/hqdefault.jpg"
        alt="${video.title}"
      >

      <div class="video-info">

        <div class="channel-icon">
          ${currentChannel === "gaming" ? "G" : "M"}
        </div>

        <div>

          <div class="video-title">
            ${video.title}
          </div>

          <div class="channel-name">

            ${
              currentChannel === "gaming"
                ? "MrBeast Gaming"
                : "MrBeast"
            }

            <span class="verified">
              ✓
            </span>

          </div>

        </div>

      </div>

    `;


    grid.appendChild(card);

  });

}


/* ==================================================
   OPEN VIDEO
================================================== */

function openVideo(videoId,title){

  document
    .getElementById("homePage")
    .style.display =
    "none";


  document
    .getElementById("watchPage")
    .style.display =
    "block";


  document
    .getElementById("watchTitle")
    .textContent =
    title;


  document
    .getElementById("watchChannelName")
    .textContent =
    currentChannel === "gaming"
      ? "MrBeast Gaming"
      : "MrBeast";


  document
    .getElementById("videoPlayer")
    .src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId) +
    "?rel=0";


  window.scrollTo({
    top:0,
    behavior:"instant"
  });

}


/* ==================================================
   SHOW HOME
================================================== */

function showHome(){

  document
    .getElementById("videoPlayer")
    .src =
    "";


  document
    .getElementById("watchPage")
    .style.display =
    "none";


  document
    .getElementById("homePage")
    .style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"instant"
  });

}


/* ==================================================
   SEARCH
================================================== */

function searchVideos(){

  const input =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  const cards =
    document.querySelectorAll(
      ".video-card"
    );


  cards.forEach(card => {

    const title =
      card.dataset.title
        .toLowerCase();


    card.style.display =
      input === "" ||
      title.includes(input)
        ? ""
        : "none";

  });

}


/* ==================================================
   OPEN CHANNEL
================================================== */

function openChannel(){

  if(currentChannel === "gaming"){

    window.open(
      "https://youtube.com/@mrbeastgaming",
      "_blank"
    );

  }else{

    window.open(
      "https://youtube.com/@mrbeast",
      "_blank"
    );

  }

}


/* ==================================================
   SETTINGS
================================================== */

function openSettings(){

  document
    .getElementById("settingsOverlay")
    .style.display =
    "flex";

}


function closeSettings(){

  document
    .getElementById("settingsOverlay")
    .style.display =
    "none";

}


/* ==================================================
   THEME
================================================== */

function toggleTheme(){

  const toggle =
    document.getElementById(
      "themeToggle"
    );


  document.body.classList.toggle(
    "light",
    !toggle.checked
  );


  localStorage.setItem(
    "vidflow-theme",
    toggle.checked
      ? "dark"
      : "light"
  );

}


/* ==================================================
   LOAD THEME
================================================== */

const savedTheme =
  localStorage.getItem(
    "vidflow-theme"
  );


if(savedTheme === "light"){

  document.body.classList.add(
    "light"
  );


  document
    .getElementById("themeToggle")
    .checked =
    false;

}


/* ==================================================
   LOAD LANGUAGE
================================================== */

const savedLanguage =
  localStorage.getItem(
    "vidflow-language"
  );


const browserLanguage =
  navigator.language
    .toLowerCase()
    .startsWith("th")
      ? "th"
      : "en";


const initialLanguage =
  savedLanguage ||
  browserLanguage;


applyLanguage(
  initialLanguage
);


/* ==================================================
   CLOSE SETTINGS OUTSIDE
================================================== */

document
  .getElementById("settingsOverlay")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){

        closeSettings();

      }

    }
  );


/* ==================================================
   START WITH MRBEAST
================================================== */

showChannel("mrbeast");


</script>

</body>
</html>
